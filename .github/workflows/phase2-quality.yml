name: Phase 2 quality (manual)

# Manual-only until the Phase 2 pilot is approved; no push or pull-request trigger.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install non-GNPy test dependencies
        run: python -m pip install pytest ruff numpy networkx pyyaml pandas pyarrow
      - name: Lint
        run: python -m ruff check .
      - name: Check formatting
        run: python -m ruff format --check .
      - name: Run non-GNPy tests
        run: python -m pytest -m "not gnpy"
        env:
          PYTHONPATH: src
